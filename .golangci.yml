version: "2"
run:
  tests: false

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
  exclusions:
    generated: lax

linters:
  default: all
  disable:
    - gocyclo # duplicate of cyclop
    - lll
    - contextcheck
    - depguard
    - err113
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forcetypeassert
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - godox
    - gomoddirectives
    - gomodguard
    - inamedparam
    - ireturn
    - mnd
    - nilnil
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - recvcheck
    - tagliatelle
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 15
    lll:
      line-length: 160
    tagliatelle:
      case:
        rules:
          json: pascal
        use-field-name: true
    importas:
      alias:
        - pkg: github.com/gamefabric/gf-apicore/apis/meta/v1
          alias: metav1
        - pkg: github.com/gamefabric/gf-core/pkg/api/core/v1
          alias: corev1
        - pkg: github.com/gamefabric/gf-core/pkg/api/armada/v1
          alias: armadav1
        - pkg: github.com/gamefabric/gf-core/pkg/api/container/v1
          alias: containerv1
        - pkg: github.com/gamefabric/gf-core/pkg/api/formation/v1
          alias: formationv1
        - pkg: github.com/gamefabric/gf-core/pkg/api/protection/v1
          alias: protectionv1
        - pkg: github.com/gamefabric/gf-core/pkg/api/rbac/v1
          alias: rbacv1
        - pkg: github.com/gamefabric/gf-core/pkg/api/authentication/v1beta1
          alias: authv1
        - pkg: github.com/gamefabric/gf-core/pkg/api/storage/v1beta1
          alias: storagev1beta1
        - pkg: github.com/gamefabric/gf-core/pkg/api/provisioning/v1beta2
          alias: provisioningv1beta2
        - pkg: github.com/gamefabric/gf-core/pkg/api/notification/v1alpha1
          alias: notificationv1alpha1
        - pkg: github.com/gamefabric/gf-core/pkg/api/billing/v2alpha1
          alias: billingv2alpha1
        - pkg: github.com/gamefabric/gf-core/pkg/api/audit/v1alpha1
          alias: auditv1alpha1
        - pkg: k8s.io/api/core/v1
          alias: kcorev1
    revive:
      rules:
        - name: var-naming
          arguments:
            - [ ]
            - [ ]
            - - skip-package-name-checks: true
                skip-package-name-collision-with-go-std: true
    gosec:
      excludes:
        - G115
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: 'ST1000: at least one file in a package should have a package comment'
      - path: (.+)\.go$
        text: 'package-comments: should have a package comment'
      - path: (.+)\.go$
        text: 'unlambda'
      - path: internal\/(.+).go
        linters:
          - dupl
      - path: (.+)\.go$
        text: "`strat` is a misspelling of `start`"
