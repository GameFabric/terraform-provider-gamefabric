name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  license:
    runs-on: "${{ inputs.runs-on }}"
    env:
      GOPROXY: https://${{ secrets.GOPROXY }},direct
      GONOSUMDB: ${{ secrets.GONOSUMDB }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          goproxy: ${{ secrets.GOPROXY }}
          goproxy-username: ${{ secrets.GOPROXY_USERNAME }}
          goproxy-token: ${{ secrets.GOPROXY_TOKEN }}

      - name: Restore Go license cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.setup-go.outputs.gocache }}
          key: ${{ runner.os }}-go-license-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-license-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-license-

      - name: Check License Report
        run: |
          make license-gen-check

      - name: Save Go build cache
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup-go.outputs.gocache }}
          key: ${{ runner.os }}-go-license-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
